version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: pixsave-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pixsave
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pixsave-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pixsave"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pixsave-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pixsave.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - pixsave-network
    depends_on:
      - postgres

  # Spring Boot Backend
  backend:
    build:
      context: ./Back-end
      dockerfile: Dockerfile
    container_name: pixsave-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pixsave
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
      TESSERACT_DATA_PATH: /usr/share/tesseract-ocr/5/tessdata
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/app/uploads
    networks:
      - pixsave-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 40s

  # React Frontend
  frontend:
    build:
      context: ./Front-end
      dockerfile: Dockerfile
    container_name: pixsave-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - pixsave-network
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  pixsave-network:
    driver: bridge
